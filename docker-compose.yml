# The local stack: PostgreSQL, Redis, the one-shot `migrate` service and the intake API (`app`).
# `docker compose up -d --wait` builds the image (Dockerfile), migrates, then starts the API.
# The queue worker (P08) is under the `worker` profile and starts only on request, because every
# message it processes is a paid model call: `docker compose --profile worker up -d --wait`.
# Credentials are for local development only, so every port is published on 127.0.0.1 and is
# unreachable from other machines. CI starts the same file (see .github/workflows/ci.yml).
# INTAKE_API_KEY is read from .env (see .env.example); without it, `app` exits with a message.
name: customer-interaction-triage

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/, so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    # Append-only persistence: queued jobs survive a Redis restart (tech-stack.md, "Queue consistency").
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies pending migrations and exits; `app` starts only after it succeeded, so the API
  # never runs against an old schema or races a migration (P02 requirements.md).
  migrate:
    build: .
    image: customer-interaction-triage-app
    command: ["node", "dist/db/migrate.js", "latest"]
    environment:
      DATABASE_URL: postgres://triage:triage@postgres:5432/triage
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: customer-interaction-triage-app
    environment:
      DATABASE_URL: postgres://triage:triage@postgres:5432/triage
      # Intake enqueues each stored interaction (P08); it tolerates Redis going away later.
      REDIS_URL: redis://redis:6379
      INTAKE_API_KEY: ${INTAKE_API_KEY:-}
      # Inside the container the API must listen on all interfaces; the port mapping below
      # still publishes it on 127.0.0.1 only.
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # BullMQ needs Redis up when the intake's queue is created.
      redis:
        condition: service_healthy
    healthcheck:
      # The image has no curl; Node's fetch does the same.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # The queue worker (P08): runs the pipeline for each job and sweeps for interactions with no
  # case. Only with `--profile worker`; it exits with a message without ANTHROPIC_API_KEY.
  worker:
    profiles: ["worker"]
    build: .
    image: customer-interaction-triage-app
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://triage:triage@postgres:5432/triage
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-opus-5-5}
      TRIAGE_EFFORT: ${TRIAGE_EFFORT:-low}
      # The investigating agent (P10); empty means the same as TRIAGE_MODEL / TRIAGE_EFFORT.
      INVESTIGATE_MODEL: ${INVESTIGATE_MODEL:-}
      INVESTIGATE_EFFORT: ${INVESTIGATE_EFFORT:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
