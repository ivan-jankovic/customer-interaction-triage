# Weekly updates for npm packages, the pinned GitHub Actions SHAs, the Compose images and the Dockerfile base image.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor and patch updates; majors arrive one by one.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Kept on 7.0.x on purpose: the TypeScript 6 API alias for typescript-eslint
      # (package.json "//" note) is revisited by hand when typescript-eslint supports 7.1+.
      - dependency-name: "@typescript/native"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Matches the Node.js runtime (24, see .nvmrc and "engines"); newer types would allow APIs
      # Node 24 doesn't have. Raise it by hand together with .nvmrc when moving to a new Node LTS.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # The Node base image in the Dockerfile. Majors are ignored for the same reason as
  # @types/node: the image follows the Node 24 runtime (.nvmrc) and moves with it by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
